<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COCONUT_PROTOCOL_V2</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #00FF00;
            background: #000;
            max-width: 95vw;
            max-height: 70vh;
        }
        #ui {
            margin-top: 20px;
            text-align: center;
        }
        button {
            background: #000;
            color: #00FF00;
            border: 2px solid #00FF00;
            padding: 15px 30px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active {
            background: #00FF00;
            color: #000;
        }
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>
    <div id="status">SYS_STATUS: READY</div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div id="ui">
        <button id="actionBtn">DEPLOY UMBRELLA</button>
        <p id="msg">PRESS TO START</p>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('actionBtn');
    const msg = document.getElementById('msg');
    const status = document.getElementById('status');

    let gameActive = false;
    let score = 0;
    // The player is now at x=300
    let coconut = { x: 300, y: 100, falling: false, speed: 0 };
    let umbrellaOpen = false;
    let spawnTimer = 0;
    let umbrellaTimer = 0;

    function resetGame() {
        gameActive = true;
        score = 0;
        coconut.falling = false;
        coconut.y = 100;
        spawnTimer = Date.now() + Math.random() * 4000 + 1000;
        msg.innerText = "SURVIVE";
        status.innerText = "SYS_STATUS: ACTIVE";
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#00FF00';
        ctx.lineWidth = 2;

        // --- DRAW LEANING PALM TREE ---
        ctx.beginPath();
        // Trunk starts right and leans left
        ctx.moveTo(380, 450); 
        ctx.bezierCurveTo(380, 300, 350, 150, 300, 100);
        ctx.stroke();

        // Detailed Fronds (Leaves)
        const frondPoints = [[-50, -20], [-40, 20], [40, -10], [10, 40], [-20, -40]];
        frondPoints.forEach(p => {
            ctx.beginPath();
            ctx.moveTo(300, 100);
            ctx.quadraticCurveTo(300 + p[0]/2, 100 + p[1]/2, 300 + p[0], 100 + p[1]);
            ctx.stroke();
        });

        // --- DRAW PERSON (Positioned at x=300) ---
        const px = 300;
        const py = 400;
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2); // Head
        ctx.moveTo(px, py + 10); ctx.lineTo(px, py + 50); // Body
        ctx.moveTo(px, py + 20); ctx.lineTo(px - 20, py + 40); // Left Arm
        ctx.moveTo(px, py + 20); ctx.lineTo(px + 20, py + 40); // Right Arm
        ctx.stroke();

        // --- DRAW UMBRELLA ---
        if (umbrellaOpen) {
            ctx.beginPath();
            ctx.arc(px, py - 20, 40, Math.PI, 0); // Umbrella top
            ctx.lineTo(px, py - 20);
            ctx.closePath();
            ctx.stroke();
            ctx.moveTo(px, py - 20); ctx.lineTo(px, py); // Handle
            ctx.stroke();
        }

        // --- DRAW COCONUT ---
        if (coconut.falling || !gameActive) {
            ctx.beginPath();
            ctx.arc(coconut.x, coconut.y, 8, 0, Math.PI * 2);
            ctx.stroke();
        }

        // --- DRAW SCORE ---
        ctx.font = "16px 'Courier New'";
        ctx.strokeText(`SUCCESS_LOG: ${score}`, 10, 30);

        update();
        requestAnimationFrame(draw);
    }

    function update() {
        if (!gameActive) return;

        if (!coconut.falling && Date.now() > spawnTimer) {
            coconut.falling = true;
            coconut.y = 100;
            coconut.speed = 6.5; // Adjusted for ~1sec fall distance
        }

        if (coconut.falling) {
            coconut.y += coconut.speed;
            
            // Collision with Umbrella
            if (coconut.y > 340 && coconut.y < 365) {
                if (umbrellaOpen) {
                    coconut.falling = false;
                    score++;
                    spawnTimer = Date.now() + Math.random() * 4000 + 1000;
                }
            }

            // Collision with Person
            if (coconut.y > 390) {
                gameActive = false;
                msg.innerText = "CRITICAL_FAILURE: REBOOT REQUIRED";
                status.innerText = "SYS_STATUS: OFFLINE";
            }
        }

        if (umbrellaOpen && Date.now() > umbrellaTimer) {
            umbrellaOpen = false;
        }
    }

    // Touch and Click Handlers
    function handleAction() {
        if (!gameActive) {
            resetGame();
        } else if (!umbrellaOpen) {
            umbrellaOpen = true;
            umbrellaTimer = Date.now() + 1000;
        }
    }

    btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(); });
    btn.addEventListener('mousedown', (e) => { handleAction(); });

    draw();
</script>
</body>
</html>
